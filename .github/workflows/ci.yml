name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_DB: algi_test, POSTGRES_USER: algi, POSTGRES_PASSWORD: test_password }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U algi -d algi_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://algi:test_password@localhost:5432/algi_test?schema=public
      IP_HASH_SECRET: ci-only-secret-with-at-least-32-characters
      PAYMENT_PROVIDER: manual
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run db:generate
      - run: npm run migrate:deploy -w @algi/database
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
