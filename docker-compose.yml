services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: algi
      POSTGRES_USER: algi
      POSTGRES_PASSWORD: algi_dev_password
    ports:
      - "5432:5432"
    volumes:
      - algi_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U algi -d algi"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - algi_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  algi_postgres_data:
  algi_redis_data:
